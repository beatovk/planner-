app = "planner-api-staging"
primary_region = "sin"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 12
    hard_limit = 18

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512MB"
